<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNITHEXERC • License Panel</title>
<style>
:root{--bg:#07090d;--panel:#0d1118;--panel2:#111722;--line:#202936;--text:#edf2f7;--muted:#7f8b9a;--accent:#69a7ff;--good:#42d392;--bad:#ff667d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#14243a 0,transparent 34%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit}.hidden{display:none!important}
.wrap{max-width:1180px;margin:auto;padding:28px}.brand{font-weight:800;letter-spacing:.14em}.muted{color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.card{background:rgba(13,17,24,.94);border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 80px #0008}.login-card{width:min(430px,100%);padding:34px}
h1{margin:8px 0 8px;font-size:28px}.label{display:block;color:#aeb8c6;margin:20px 0 8px}.input{width:100%;background:#080c12;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:13px 14px;outline:none}.input:focus{border-color:var(--accent)}
.btn{border:0;border-radius:11px;padding:12px 16px;cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#07101c}.ghost{background:#151c27;color:#dce5ef;border:1px solid var(--line)}.danger{background:#29131a;color:#ff9aac;border:1px solid #51222e}
.login .btn{width:100%;margin-top:20px}.status{margin-top:14px;min-height:20px;color:var(--muted)}.status.bad{color:var(--bad)}.status.good{color:var(--good)}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.actions{display:flex;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:20px}.stat b{display:block;font-size:27px;margin-top:6px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.toolbar h2{margin:0}.table{overflow:auto}.row{display:grid;grid-template-columns:1.5fr .7fr 1fr 1fr .6fr;gap:15px;align-items:center;padding:15px;border-bottom:1px solid var(--line);min-width:760px}.head{color:var(--muted);font-size:12px;text-transform:uppercase}.key{font-family:ui-monospace,monospace}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;background:#153024;color:#76e4aa}.pill.revoked{background:#30141b;color:#ff8497}.empty{padding:45px;text-align:center;color:var(--muted)}
@media(max-width:700px){.stats{grid-template-columns:1fr}.wrap{padding:18px}}
</style>
</head>
<body>
<section id="login" class="login">
  <div class="card login-card">
    <div class="brand">SNITHEXERC</div>
    <h1>License Panel</h1>
    <div class="muted">Secure administrator access</div>
    <label class="label">Username</label>
    <input id="username" class="input" autocomplete="username" placeholder="Admin username">
    <label class="label">Password</label>
    <input id="password" class="input" type="password" autocomplete="current-password" placeholder="Admin password">
    <button id="loginBtn" class="btn primary">SIGN IN</button>
    <div id="loginStatus" class="status"></div>
  </div>
</section>

<section id="app" class="hidden">
<div class="wrap">
<header>
  <div><div class="brand">SNITHEXERC</div><div class="muted">License Administration</div></div>
  <div class="actions"><button id="createBtn" class="btn primary">+ CREATE KEY</button><button id="logoutBtn" class="btn ghost">LOG OUT</button></div>
</header>
<div class="stats">
  <div class="card stat"><span class="muted">ACTIVE</span><b id="active">0</b></div>
  <div class="card stat"><span class="muted">EXPIRED</span><b id="expired">0</b></div>
  <div class="card stat"><span class="muted">REVOKED</span><b id="revoked">0</b></div>
</div>
<div class="toolbar"><h2>License Keys</h2><span id="message" class="muted"></span></div>
<div class="card table">
  <div class="row head"><div>Key</div><div>Status</div><div>Created</div><div>Expires</div><div>Action</div></div>
  <div id="rows"></div>
</div>
</div>
</section>
<script>
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||"Request failed");return d}
function showApp(){ $("login").classList.add("hidden");$("app").classList.remove("hidden");loadKeys()}
async function check(){try{await api("/api/me");showApp()}catch{}}
$("loginBtn").onclick=async()=>{const s=$("loginStatus");s.className="status";s.textContent="Authenticating...";try{await api("/api/login",{method:"POST",body:JSON.stringify({username:$("username").value,password:$("password").value})});s.className="status good";s.textContent="Login successful";showApp()}catch(e){s.className="status bad";s.textContent=e.message}}
$("logoutBtn").onclick=async()=>{await api("/api/logout",{method:"POST"});location.reload()}
$("createBtn").onclick=async()=>{const days=prompt("License duration in days:","30");if(days===null)return;try{const d=await api("/api/keys",{method:"POST",body:JSON.stringify({days:Number(days)})});await loadKeys();navigator.clipboard?.writeText(d.key.key);alert("Key created:\\n\\n"+d.key.key+"\\n\\nCopied to clipboard if supported.")}catch(e){alert(e.message)}}
async function revoke(id){if(!confirm("Revoke this license?"))return;try{await api("/api/revoke",{method:"POST",body:JSON.stringify({id})});loadKeys()}catch(e){alert(e.message)}}
async function loadKeys(){try{const d=await api("/api/keys");const now=Date.now();let a=0,e=0,r=0;d.keys.forEach(k=>{if(k.status==="revoked")r++;else if(Date.parse(k.expiresAt)<=now)e++;else a++});$("active").textContent=a;$("expired").textContent=e;$("revoked").textContent=r;const rows=d.keys.map(k=>{const expired=k.status!=="revoked"&&Date.parse(k.expiresAt)<=now;const status=k.status==="revoked"?"revoked":expired?"expired":"active";return `<div class="row"><div class="key">${k.key}</div><div><span class="pill ${status==="revoked"?"revoked":""}">${status.toUpperCase()}</span></div><div>${new Date(k.createdAt).toLocaleString()}</div><div>${new Date(k.expiresAt).toLocaleString()}</div><div>${status==="active"?`<button class="btn danger" onclick="revoke('${k.id}')">Revoke</button>`:"—"}</div></div>`}).join("");$("rows").innerHTML=rows||'<div class="empty">No license keys yet.</div>'}catch(e){$("message").textContent=e.message}}
check();
</script>
</body>
</html>
